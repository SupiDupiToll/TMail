[workspace]
resolver = "2"
members = ["core", "src-tauri"]
exclude = ["vendor/tuta", "ui"]
default-members = ["core"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/tmail"
homepage = "https://example.invalid/tmail"

[workspace.dependencies]
tuta_sdk = { package = "tuta-sdk", path = "vendor/tuta/tuta-sdk/rust/sdk", features = ["net"] }
crypto-primitives = { path = "vendor/tuta/tuta-sdk/rust/crypto-primitives" }
base64 = "0.22.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.117"
thiserror = "2.0"
log = "0.4.22"
tokio = { version = "1.43", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "signal",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures = "0.3.31"
form_urlencoded = "1"
num_enum = "0.7.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
time = { version = "0.3.37", features = ["serde", "macros", "formatting", "parsing"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
new_without_default = "allow"
too_many_arguments = "allow"
