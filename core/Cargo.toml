[package]
name = "tmail-core"
description = "Headless Tuta Mail protocol, session, sync and storage core for TMail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tuta_sdk.workspace = true
crypto-primitives.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
form_urlencoded.workspace = true
num_enum.workspace = true
rand_core.workspace = true
zeroize.workspace = true
time.workspace = true
async-trait = "0.1"

# Encrypted-at-rest cache. SQLCipher is compiled in (vendored OpenSSL) so the
# Arch package does not depend on a system SQLCipher build.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# OS keyring: Secret Service on Linux (gnome-keyring / KWallet).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"

[lints]
workspace = true
